name: Windows demonstration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-demo:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: cmd
        working-directory: SmartWaste AI
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: SmartWaste AI
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: SmartWaste AI/requirements.txt
      - name: Install with the actual Windows setup script
        run: call setup.bat
      - name: Check installed dependencies
        run: .venv\Scripts\python.exe -m pip check
      - name: Test all pages, fuzzy inference and the trained model on Windows
        run: .venv\Scripts\python.exe -m pytest -q
      - name: Download the real resized demonstration data
        run: .venv\Scripts\python.exe -m scripts.download_dataset
      - name: Install browser testing tools
        run: |
          .venv\Scripts\python.exe -m pip install playwright==1.56.0
          if errorlevel 1 exit /b 1
          .venv\Scripts\python.exe -m playwright install chromium
      - name: Exercise run.bat, image upload, real inference and contamination changes
        run: .venv\Scripts\python.exe -m scripts.capture_screenshots --windows-launcher --responsive --review-previews
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: smartwaste-windows-demo
          path: SmartWaste AI/assets/screenshots/
